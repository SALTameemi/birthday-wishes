<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Birthday Wishes</title>
<meta name="description" content="Write a birthday wish for Her Excellency Prof. Rowaida AlMaaitah — wishes appear live on the screen.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700;800&family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --navy:#12356B; --navy2:#1b4a8f; --gold:#C8A04B; --gold-soft:#e8d4a0;
    --soft:#eef4fc; --card:#ffffff; --ink:#1a2740; --muted:#64789c; --line:#e0e9f6;
  }
  *{box-sizing:border-box}
  html,body{margin:0;min-height:100%}
  body{
    font-family:"Poppins",system-ui,-apple-system,Arial,sans-serif;color:var(--ink);
    background:radial-gradient(1200px 520px at 50% -8%, #ffffff 0%, var(--soft) 55%),linear-gradient(180deg,#eef4fc,#dde8f8);
    min-height:100vh;
  }
  .brand{width:100%;background:#fff;border-bottom:3px solid var(--gold);text-align:center;
    box-shadow:0 2px 14px rgba(18,53,107,.06)}
  .brand img{display:block;width:100%;max-width:760px;margin:0 auto}
  .page{max-width:600px;margin:0 auto;padding:20px 16px 46px}

  .hero{text-align:center;margin:18px 0 20px}
  .hbd{font-family:"Playfair Display",serif;font-weight:800;color:var(--navy);
    font-size:40px;line-height:1.05;margin:0}
  .hbd .amp{color:var(--gold)}
  .hero .cake{font-size:40px;margin-bottom:2px}
  .who{display:inline-block;margin-top:12px;font-weight:700;font-size:17px;color:#fff;
    background:linear-gradient(90deg,var(--navy),var(--navy2));padding:9px 20px;border-radius:999px;
    box-shadow:0 8px 20px rgba(18,53,107,.22)}
  .hero .sub{font-size:14px;color:var(--muted);margin-top:14px}

  .divider{display:flex;align-items:center;justify-content:center;gap:10px;margin:22px 0}
  .divider .ln{height:2px;width:70px;background:var(--gold-soft)}
  .divider .dot{color:var(--gold);font-size:18px}

  .card{background:var(--card);border:1px solid var(--line);border-radius:20px;
    box-shadow:0 14px 36px rgba(18,53,107,.10);padding:20px 18px}
  label{display:block;font-size:12.5px;font-weight:600;color:var(--muted);margin:2px 2px 7px;letter-spacing:.02em}
  input,textarea{width:100%;border:1.5px solid var(--line);border-radius:13px;padding:13px 15px;
    font-size:16px;font-family:inherit;color:var(--ink);background:#fcfdff;outline:none;transition:.15s}
  input:focus,textarea:focus{border-color:var(--navy2);background:#fff;box-shadow:0 0 0 3px rgba(27,74,143,.14)}
  textarea{min-height:124px;resize:vertical;line-height:1.55}
  .row{margin-bottom:15px}
  .count{font-size:11.5px;color:var(--muted);text-align:right;margin-top:5px}
  button.send{width:100%;border:0;border-radius:15px;padding:16px;font-size:17px;font-weight:700;color:#fff;
    background:linear-gradient(90deg,var(--navy),var(--navy2));cursor:pointer;
    box-shadow:0 10px 24px rgba(18,53,107,.28);transition:transform .06s}
  button.send::after{content:" 🎉"}
  button.send:active{transform:translateY(1px)}
  button.send[disabled]{opacity:.6;cursor:default}
  .msg{margin-top:14px;text-align:center;font-size:14px;min-height:20px}
  .err{color:#b0202a;font-weight:700}
  .thanks{text-align:center;padding:16px 6px}
  .thanks .big{font-size:48px}
  .thanks h2{font-family:"Playfair Display",serif;color:var(--navy);margin:10px 0 4px;font-size:28px}
  .thanks p{color:var(--muted);margin:0 0 18px}
  .again{display:inline-block;border:1.5px solid var(--line);background:#fff;border-radius:13px;
    padding:11px 22px;font-size:15px;color:var(--navy);font-weight:700;cursor:pointer}
  .hostlink{display:block;text-align:center;margin-top:22px;font-size:12px;color:var(--muted);text-decoration:none}
  .hostlink:hover{color:var(--navy)}

  /* ---- WALL ---- */
  body.wall{background:radial-gradient(1500px 760px at 50% -6%, #1b386e 0%, #0c1c40 72%);color:#eaf1ff}
  .wall .brand{background:#fff}
  .wall-wrap{max-width:1560px;margin:0 auto;padding:22px 22px 40px}
  .wall-head{text-align:center;margin:10px 0 18px}
  .wall-head h1{font-family:"Playfair Display",serif;margin:4px 0 2px;font-size:40px;color:#fff;font-weight:800}
  .wall-head .who2{color:var(--gold-soft);font-weight:700;font-size:21px}
  .wall-head .count{color:#aec3ea;font-size:14px;margin-top:8px}
  .wall-photo{display:block;max-width:420px;width:min(60%,420px);margin:6px auto 22px;
    border-radius:16px;box-shadow:0 14px 40px rgba(0,0,0,.35);border:3px solid rgba(255,255,255,.9)}
  .wall-grid{columns:330px;column-gap:16px;margin-top:6px}
  .wish{break-inside:avoid;margin:0 0 16px;background:#fff;color:#1a2740;border-radius:16px;
    padding:16px 18px;box-shadow:0 12px 28px rgba(0,0,0,.24);border-top:4px solid var(--gold);
    animation:pop .5s ease both}
  .wish .text{font-size:17px;line-height:1.55;white-space:pre-wrap;word-wrap:break-word}
  .wish .from{margin-top:11px;font-size:13.5px;color:var(--navy);font-weight:700}
  .wish .from::before{content:"— "}
  @keyframes pop{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
  .empty{text-align:center;color:#bcccee;margin-top:46px;font-size:19px}
  @media(max-width:560px){.hbd{font-size:32px}.wall-head h1{font-size:30px}}
</style>
</head>

<div id="app"></div>
<script>
const SUPABASE_URL="https://xmdkvxzflbbdnkwsggjm.supabase.co";
const KEY="sb_publishable_5UXQ_sYU5KOnRob11-ic1g_VtjUhXP8";
const TABLE="birthday_wishes";
const HEADERS={"apikey":KEY,"Authorization":"Bearer "+KEY};
function esc(s){return (s||"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));}
async function sendWish(name,message){
  const r=await fetch(SUPABASE_URL+"/rest/v1/"+TABLE,{method:"POST",
    headers:{...HEADERS,"Content-Type":"application/json","Prefer":"return=minimal"},
    body:JSON.stringify({name:name||null,message:message})});
  if(!r.ok) throw new Error("HTTP "+r.status);
}
async function loadWishes(){
  const r=await fetch(SUPABASE_URL+"/rest/v1/"+TABLE+"?select=name,message,created_at&order=created_at.desc&limit=500",{headers:HEADERS});
  if(!r.ok) throw new Error("HTTP "+r.status); return await r.json();
}
function renderForm(){
  document.body.className="";
  document.getElementById("app").innerHTML=`
    <div class="page">
      <div class="hero">
        <div class="cake">🎂</div>
        <h1 class="hbd">Happy Birthday</h1>
        <div class="who">Her Excellency Prof. Rowaida AlMaaitah</div>
        <div class="sub">Write your name and a wish — it appears live on the screen ✨</div>
      </div>
      <div class="divider"><span class="ln"></span><span class="dot">✦</span><span class="ln"></span></div>
      <div class="card">
        <div class="row"><label for="nm">Your name</label><input id="nm" maxlength="80" placeholder="Your name"></div>
        <div class="row"><label for="ms">Your wish</label>
          <textarea id="ms" maxlength="500" placeholder="Write your birthday wish here..."></textarea>
          <div class="count"><span id="cc">0</span>/500</div></div>
        <button class="send" id="go">Send wish</button>
        <div class="msg" id="msg"></div>
      </div>
      <a class="hostlink" href="#wall">Display screen (for the host)</a>
    </div>`;
  const ms=document.getElementById("ms"),cc=document.getElementById("cc");
  ms.addEventListener("input",()=>cc.textContent=ms.value.length);
  document.getElementById("go").addEventListener("click",submit);
}
async function submit(){
  const nm=document.getElementById("nm").value.trim();
  const ms=document.getElementById("ms").value.trim();
  const msg=document.getElementById("msg"),btn=document.getElementById("go");
  if(ms.length<1){msg.className="msg err";msg.textContent="Please write your wish first 🙂";return;}
  btn.disabled=true;msg.className="msg";msg.textContent="Sending...";
  try{await sendWish(nm,ms);renderThanks();}
  catch(e){btn.disabled=false;msg.className="msg err";msg.textContent="Couldn't send, please try again.";}
}
function renderThanks(){
  document.getElementById("app").innerHTML=`
    <div class="page"><div class="card thanks">
      <div class="big">💙🎉</div><h2>Thank you!</h2>
      <p>Your wish has been added and will appear on the screen.</p>
      <span class="again" id="again">Add another wish</span>
    </div></div>`;
  document.getElementById("again").addEventListener("click",renderForm);
}
let wallTimer=null;
function renderWallShell(){
  document.body.className="wall";
  document.getElementById("app").innerHTML=`
    <div class="wall-wrap"><div class="wall-head">
      <h1>🎂 Happy Birthday</h1>
      <div class="who2">Her Excellency Prof. Rowaida AlMaaitah</div>
      <div class="count" id="wc">...</div></div>
      <img class="wall-photo" src="birthday.png" alt="Happy Birthday Prof. Rowaida AlMaaitah" onerror="this.style.display='none'">
      <div id="wallbody"></div></div>`;
}
async function refreshWall(){
  try{
    const rows=await loadWishes();
    const wc=document.getElementById("wc"),body=document.getElementById("wallbody");
    if(!body)return; if(wc)wc.textContent=rows.length+" wishes";
    if(rows.length===0){body.innerHTML='<div class="empty">Be the first to write a wish 💙</div>';return;}
    body.innerHTML='<div class="wall-grid">'+rows.map(w=>{
      const from=w.name&&w.name.trim()?esc(w.name.trim()):"Guest";
      return `<div class="wish"><div class="text">${esc(w.message)}</div><div class="from">${from}</div></div>`;
    }).join("")+'</div>';
  }catch(e){}
}
function startWall(){renderWallShell();refreshWall();if(wallTimer)clearInterval(wallTimer);wallTimer=setInterval(refreshWall,5000);}
function route(){ if(location.hash==="#wall")startWall(); else {if(wallTimer){clearInterval(wallTimer);wallTimer=null;}renderForm();} }
window.addEventListener("hashchange",route); route();
</script>
